name: sparrowMCP-apm
version: 1.0.0
description: APM project for sparrowMCP-apm
author: Sparrow

targets:
  - claude
  - codex
  - copilot
  - cursor
  - gemini
  - antigravity
  - opencode
  - windsurf

dependencies:
  apm: []
  mcp:
    - name: sparrow-mcp
      registry: false
      transport: stdio
      command: "npx"
      args:
        - -y
        - "@sparrowai/sparrow-mcp@1.2.0.beta.5"
      env:
        SPARROW_API_KEY: SPARROW_API_KEY
        SPARROW_API_URL: https://ondemand.sparrowcloud.ai

includes: auto

scripts: {}
