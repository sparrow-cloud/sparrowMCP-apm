name: sparrowMCP-apm
version: 1.0.0
description: APM project for sparrowMCP-apm
author: Sparrow

targets:
  - claude
  - codex
  - copilot
  - cursor
  - gemini
  - opencode
  - windsurf

instructions:
  - file: "./.apm/instructions/cursor.instructions.md"
    targets:
      - client: "cursor"

dependencies:
  apm: []
  mcp:
    - name: sparrow-mcp
      registry: false
      transport: stdio
      command: "npx"
      args:
        - -y
        - @sparrowai/sparrow-mcp
      env:
        SPARROW_API_KEY: SPARROW_API_KEY
        SPARROW_API_URL: https://ondemand.sparrowcloud.ai

includes:
  - "instructions/**/*"

scripts: {}
