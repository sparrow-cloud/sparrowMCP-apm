name: sparrowMCP-apm
version: 1.0.0
description: APM project for sparrowMCP-apm
author: Sparrow

targets:
  - claude
  - codex
  - copilot
  - cursor
  - gemini
  - antigravity
  - opencode
  - windsurf

# instructions:
#   - file: "./.apm/instructions/cursor.instructions.md"
#     targets:
#       - client: "cursor"

# skills:
#   - file: "./.apm/skills/**/*"

dependencies:
  apm: []
  mcp:
    - name: sparrow-mcp
      registry: false
      transport: stdio
      command: "npx"
      args:
        - -y
        - "@sparrowai/sparrow-mcp@0.0.1"
      env:
        SPARROW_API_KEY: SPARROW_API_KEY
        SPARROW_API_URL: https://ondemand.sparrowcloud.ai

includes: auto

scripts: {}
