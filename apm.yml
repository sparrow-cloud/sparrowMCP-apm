name: sparrowMCP-apm
version: 1.0.0
description: APM project for sparrowMCP-apm
author: Sparrow

targets:
  - claude
  - codex
  - copilot
  - cursor
  - gemini
  - opencode
  - windsurf

instructions:
  - file: "./.apm/instructions/cursor.instructions.md"
    targets:
      - client: "cursor"

dependencies:
  apm: []
  mcp:
    - io.github.sparrow-cloud/sparrowMCP-apm

    - name: filesystem
      registry: false
      transport: stdio
      command: "node"
      args: ["your-mcp-server-path"]
      env:
        SPARROW_API_KEY: "SPARROW_API_KEY"
        SPARROW_API_URL: "https://ondemand.sparrowcloud.ai"

includes:
  - "instructions/**/*"
  - "dist/**/*" # 💡 빌드된 JS 파일들이 포함되도록 명시해 주는 것이 안전합니다.
scripts: {}
